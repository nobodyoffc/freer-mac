<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Freer mark: the Freecash ƒ, an integral-style f whose stroke swells
       in the middle and ends in a hook at each tip, crossed on the left by two
       slanted bars. White on a sky gradient, full-bleed. The paths are in the
       units of the 334x402 reference drawing.
       The source of every app's icon: tools/package/make-icon.swift (Mac),
       the iOS repo's tools/make-icon.swift, and the Android repo's
       ic_launcher_foreground / ic_launcher_background drawables. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0A3A96"/>
      <stop offset="0.6" stop-color="#1F7BE0"/>
      <stop offset="1" stop-color="#5BBBFA"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#fff" transform="translate(43.0 -106.8) scale(2.8)">
    <!-- stem -->
    <path d="M253.5,88.5 C240,85.5 214,88 197,102.5 C181,116.5 175.5,140 171.5,165 L166.5,200 L161.5,250 C158.5,285 155.5,311 146.5,327.5 C137.5,339.5 120,340.5 108,336.5 L93.5,351.5 C97,355.5 106,355.5 115,355 C137,352 153.5,339 161.5,326 C173.5,306 177,281 180,250 L185,205 L189,168 C192,140 197,120 206,108 C216,100.5 229,102 238.5,105.5 Z"/>
    <!-- bars -->
    <path d="M115,172.5 L228,172.5 L214,190 L101.5,190 Z"/>
    <path d="M96,207.5 L208,207.5 L193.5,226 L81.5,226 Z"/>
  </g>
</svg>
